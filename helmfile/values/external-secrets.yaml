# image: set in helmfile.yaml.gotmpl (pinned to the chart's appVersion).
installCRDs: true
serviceAccount:
  name: external-secrets # must match the Pod Identity association in aws/main.tf

# Our tagged Graviton pool, like Gitea (not Auto Mode's general-purpose pool).
nodeSelector:
  karpenter.sh/nodepool: workloads
webhook:
  nodeSelector:
    karpenter.sh/nodepool: workloads
certController:
  nodeSelector:
    karpenter.sh/nodepool: workloads
