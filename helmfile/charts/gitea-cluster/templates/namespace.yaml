apiVersion: v1
kind: Namespace
metadata:
  name: gitea
  labels:
    # Pod Security Admission: block privileged pods outright, warn on anything short of "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # EKS Auto Mode's load balancer webhook adds a readiness gate to every pod here, so a new pod
    # counts as Ready (and the rollout moves on) only once the ALB/NLB report its target healthy.
    # Auto Mode's label; the standalone controller's elbv2.k8s.aws/... label does nothing here.
    eks.amazonaws.com/pod-readiness-gate-inject: enabled
