{{- /*
  ESO renders its own Go templates, so its {{ }} placeholders are escaped here as
  {{` ... `}} to get past Helm untouched.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: gitea-admin
    template:
      data:
        username: {{ .Values.adminUser | quote }}
        password: {{`"{{ .password }}"`}}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secretNames.admin }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-app-ini-secrets
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: gitea-app-ini-secrets
    template:
      # One key per app.ini section; the Gitea chart merges them over its own config.
      data:
        database: |
          PASSWD={{`{{ .db }}`}}
        cache: |
          ADAPTER=redis
          HOST=rediss://:{{`{{ .valkey }}`}}@{{ .Values.valkeyEndpoint }}/0?pool_size=100&idle_timeout=180s
        session: |
          PROVIDER=redis
          PROVIDER_CONFIG=rediss://:{{`{{ .valkey }}`}}@{{ .Values.valkeyEndpoint }}/0?pool_size=100&idle_timeout=180s
        queue: |
          TYPE=redis
          CONN_STR=rediss://:{{`{{ .valkey }}`}}@{{ .Values.valkeyEndpoint }}/0?pool_size=100&idle_timeout=180s
        global_lock: |
          SERVICE_TYPE=redis
          SERVICE_CONN_STR=rediss://:{{`{{ .valkey }}`}}@{{ .Values.valkeyEndpoint }}/0?pool_size=100&idle_timeout=180s
        metrics: |
          ENABLED=true
          TOKEN={{`{{ .metrics }}`}}
        # Gitea's signing keys, the same for every pod (bootstrap/state, gitea/app-ini-keys).
        security: |
          SECRET_KEY={{`{{ .secret_key }}`}}
          INTERNAL_TOKEN={{`{{ .internal_token }}`}}
        oauth2: |
          JWT_SECRET={{`{{ .jwt_secret }}`}}
        server: |
          LFS_JWT_SECRET={{`{{ .lfs_jwt_secret }}`}}
  data:
    - secretKey: db
      remoteRef:
        key: {{ .Values.secretNames.db }}
    - secretKey: valkey
      remoteRef:
        key: {{ .Values.secretNames.valkey }}
    - secretKey: metrics
      remoteRef:
        key: {{ .Values.secretNames.metrics }}
    {{- range list "secret_key" "internal_token" "jwt_secret" "lfs_jwt_secret" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secretNames.app_ini_keys }}
        property: {{ . }}
    {{- end }}
---
# The SSH host key every Gitea pod serves (see bootstrap/state: one key, generated once).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-ssh-host-key
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: gitea-ssh-host-key
  data:
    - secretKey: gitea.ed25519
      remoteRef:
        key: {{ .Values.secretNames.ssh_host_key }}
