<svg xmlns="http://www.w3.org/2000/svg" width="976" height="960" viewBox="0 0 976 960">
<rect width="976" height="960" fill="#ffffff"/>
<text x="40.0" y="44.0" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">What terragrunt run --all apply does</text>
<text x="40.0" y="68.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Run from bootstrap/. Steps run top to bottom; each one needs the one before it.</text>
<rect x="104.0" y="104.0" width="832.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="104" width="5" height="72" rx="2" fill="#6e7781"/>
<text x="128.0" y="134.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Create the state bucket</text>
<text x="912.0" y="134.0" font-size="12" fill="#6e7781" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Terragrunt</text>
<text x="128.0" y="156.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gitea-tfstate-&lt;account&gt;-&lt;region&gt;, empty (--backend-bootstrap)</text>
<rect x="104.0" y="200.0" width="832.0" height="144.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="200" width="5" height="144" rx="2" fill="#8250df"/>
<text x="128.0" y="230.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Bootstrap the account</text>
<text x="912.0" y="230.0" font-size="12" fill="#8250df" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">state/ unit · tofu apply · ~1 min</text>
<text x="128.0" y="252.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Everything later steps read. Names start with gitea-&lt;suffix&gt;.</text>
<rect x="128.0" y="272.0" width="107.4" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="181.7" y="288.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">random suffix</text>
<rect x="243.4" y="272.0" width="194.7" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="340.7" y="288.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">KMS key (state encryption)</text>
<rect x="446.1" y="272.0" width="181.3" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="536.7" y="288.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">OIDC provider + CI roles</text>
<rect x="635.4" y="272.0" width="174.6" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="722.6" y="288.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">platform-eks-admin role</text>
<rect x="128.0" y="304.0" width="174.6" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="215.3" y="320.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Secrets Manager secrets</text>
<rect x="310.6" y="304.0" width="228.3" height="24.0" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="424.7" y="320.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">GitHub envs (with GITHUB_TOKEN)</text>
<rect x="104.0" y="368.0" width="832.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="368" width="5" height="72" rx="2" fill="#0969da"/>
<text x="128.0" y="398.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Read state/'s outputs</text>
<text x="912.0" y="398.0" font-size="12" fill="#0969da" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gitea/ unit · dependency</text>
<text x="128.0" y="420.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">suffix, KMS key ARN and role names</text>
<rect x="104.0" y="464.0" width="832.0" height="112.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="464" width="5" height="112" rx="2" fill="#0969da"/>
<text x="128.0" y="494.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Build the AWS stack</text>
<text x="912.0" y="494.0" font-size="12" fill="#0969da" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gitea/ unit · tofu apply on aws/ · ~20 min</text>
<text x="128.0" y="516.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">RDS and Valkey take their passwords from step 2's secrets.</text>
<rect x="128.0" y="536.0" width="40.2" height="24.0" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="148.1" y="552.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">VPC</text>
<rect x="176.2" y="536.0" width="161.1" height="24.0" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="256.7" y="552.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">EKS Auto Mode cluster</text>
<rect x="345.3" y="536.0" width="114.1" height="24.0" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="402.3" y="552.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">RDS PostgreSQL</text>
<rect x="467.4" y="536.0" width="141.0" height="24.0" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="537.8" y="552.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ElastiCache Valkey</text>
<rect x="616.3" y="536.0" width="40.2" height="24.0" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="636.4" y="552.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">EFS</text>
<rect x="104.0" y="600.0" width="832.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="600" width="5" height="72" rx="2" fill="#bf8700"/>
<text x="128.0" y="630.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Connect kubectl</text>
<text x="912.0" y="630.0" font-size="12" fill="#bf8700" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gitea/ after_hook</text>
<text x="128.0" y="652.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">aws eks update-kubeconfig (assumes platform-eks-admin)</text>
<rect x="104.0" y="696.0" width="832.0" height="112.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="696" width="5" height="112" rx="2" fill="#bf8700"/>
<text x="128.0" y="726.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Install everything in the cluster</text>
<text x="912.0" y="726.0" font-size="12" fill="#bf8700" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gitea/ after_hook · helmfile apply</text>
<text x="128.0" y="748.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">In this order:</text>
<rect x="128.0" y="768.0" width="127.5" height="24.0" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="191.8" y="784.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">External Secrets</text>
<rect x="263.5" y="768.0" width="255.2" height="24.0" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="391.1" y="784.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">EFS volume + load balancer settings</text>
<rect x="526.7" y="768.0" width="107.4" height="24.0" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="580.4" y="784.0" font-size="12" fill="#1f2328" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Gitea, 2 pods</text>
<rect x="104.0" y="832.0" width="832.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="832" width="5" height="72" rx="2" fill="#bf8700"/>
<text x="128.0" y="862.0" font-size="16" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Wait and print</text>
<text x="912.0" y="862.0" font-size="12" fill="#bf8700" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gitea/ after_hook</text>
<text x="128.0" y="884.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">kubectl wait for the ALB and NLB, then print the Gitea URL and SSH host</text>
