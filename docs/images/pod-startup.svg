<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="748" viewBox="0 0 1176 748">
<rect width="1176" height="748" fill="#ffffff"/>
<text x="40.0" y="44.0" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">What happens when a new Gitea pod starts</text>
<text x="40.0" y="68.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Every pod start runs this: an upgrade, a rollout restart, a node replacement or a scale-up.</text>
<rect x="104.0" y="104.0" width="640.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="104" width="5" height="72" rx="2" fill="#8250df"/>
<text x="128.0" y="134.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">init-directories</text>
<text x="720.0" y="134.0" font-size="12" fill="#8250df" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">init container</text>
<text x="128.0" y="158.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Creates Gitea's folders on the shared EFS volume (mkdir -p).</text>
<rect x="104.0" y="192.0" width="640.0" height="72.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="192" width="5" height="72" rx="2" fill="#8250df"/>
<text x="128.0" y="222.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">init-app-ini</text>
<text x="720.0" y="222.0" font-size="12" fill="#8250df" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">init container</text>
<text x="128.0" y="246.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Builds this pod's own app.ini from the chart values and secrets.</text>
<rect x="104.0" y="280.0" width="640.0" height="112.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="280" width="5" height="112" rx="2" fill="#8250df"/>
<text x="128.0" y="310.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">configure-gitea</text>
<text x="720.0" y="310.0" font-size="12" fill="#8250df" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">init container</text>
<text x="128.0" y="334.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Runs gitea migrate: updates the tables if this version is newer,</text>
<text x="128.0" y="354.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">and changes nothing if they're already current (a restart).</text>
<text x="128.0" y="374.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Then creates the admin user, or syncs its password.</text>
<rect x="104.0" y="408.0" width="640.0" height="92.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="408" width="5" height="92" rx="2" fill="#0969da"/>
<text x="128.0" y="438.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Gitea starts</text>
<text x="720.0" y="438.0" font-size="12" fill="#0969da" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">readiness probe</text>
<text x="128.0" y="462.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Kubernetes calls GET /api/v1/version every 10 s.</text>
<text x="128.0" y="482.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Until it answers, the pod gets no traffic.</text>
<rect x="104.0" y="516.0" width="640.0" height="92.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="516" width="5" height="92" rx="2" fill="#0969da"/>
<text x="128.0" y="546.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Load balancers check it</text>
<text x="720.0" y="546.0" font-size="12" fill="#0969da" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">readiness gates</text>
<text x="128.0" y="570.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ALB checks /api/healthz, NLB checks the SSH port.</text>
<text x="128.0" y="590.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The pod stays not ready until both see it healthy.</text>
<rect x="104.0" y="624.0" width="640.0" height="92.0" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="104" y="624" width="5" height="92" rx="2" fill="#1a7f37"/>
<text x="128.0" y="654.0" font-size="15" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Ready, gets traffic</text>
<text x="720.0" y="654.0" font-size="12" fill="#1a7f37" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ready</text>
<text x="128.0" y="678.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Now Kubernetes may stop one old pod: 60 s pause, then</text>
<text x="128.0" y="698.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">up to 300 s for open requests, clones and pushes to finish.</text>
<line x1="64" y1="136" x2="64" y2="656" stroke="#d1d9e0" stroke-width="2"/>
<circle cx="64" cy="136" r="16" fill="#8250df"/>
<text x="64.0" y="141.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1</text>
<circle cx="64" cy="224" r="16" fill="#8250df"/>
<text x="64.0" y="229.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">2</text>
<circle cx="64" cy="312" r="16" fill="#8250df"/>
<text x="64.0" y="317.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">3</text>
<circle cx="64" cy="440" r="16" fill="#0969da"/>
<text x="64.0" y="445.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4</text>
<circle cx="64" cy="548" r="16" fill="#0969da"/>
<text x="64.0" y="553.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">5</text>
<circle cx="64" cy="656" r="16" fill="#1a7f37"/>
<text x="64.0" y="661.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">6</text>
<rect x="776.0" y="104.0" width="360.0" height="112.0" rx="12" fill="#f6f8fa" stroke="#6e7781" stroke-width="1"/>
<text x="796.0" y="134.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Old pods, during steps 1 to 5</text>
<text x="796.0" y="158.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Keep serving every request.</text>
<text x="796.0" y="178.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">After a migration they work on</text>
<text x="796.0" y="198.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the updated tables.</text>
<rect x="776.0" y="280.0" width="360.0" height="132.0" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="796.0" y="310.0" font-size="14" fill="#cf222e" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">If step 3, 4 or 5 never passes</text>
<text x="796.0" y="334.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The new pod never becomes ready,</text>
<text x="796.0" y="354.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">so no old pod is stopped. The old</text>
<text x="796.0" y="374.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pods keep serving and the deploy</text>
<text x="796.0" y="394.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">fails in CI.</text>
<rect x="776.0" y="516.0" width="360.0" height="132.0" rx="12" fill="#f6f8fa" stroke="#6e7781" stroke-width="1"/>
<text x="796.0" y="546.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Liveness probe</text>
<text x="796.0" y="570.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">TCP on the HTTP port, from 200 s</text>
<text x="796.0" y="590.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">after start. 10 failures in a row</text>
<text x="796.0" y="610.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">restart the container. It never</text>
<text x="796.0" y="630.0" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">decides who gets traffic.</text>
</svg>
