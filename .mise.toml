# Pinned deploy toolchain: `mise install` gives everyone the same versions CI uses.
# Not installed by mise, install them yourself: the AWS CLI (required: Terragrunt hooks and
# Helmfile call it), git (required), and gh (only for the CI bootstrap, Method 2).
[tools]
opentofu = "1.13.1"
terragrunt = "1.1.6"
helm = "4.3.1"
# The Helm plugin `helmfile diff`/`apply` need. Helm runs it as diff/bin/diff; the mise registry
# entry renames the binary to helm-diff, so keep its real name.
helm-diff = { version = "3.15.15", rename_exe = "diff" }
helmfile = "1.8.2"
kustomize = "5.8.3"   # helmfile's strategicMergePatches run through it
kubectl = "1.37.1"    # required: the apply hook reads the load balancer hostnames with it

[env]
# Helm loads plugins from here: the helm-diff release mise installed above, so the plugin is
# pinned like every other tool and never touches ~/.local/share/helm.
HELM_PLUGINS = { value = "{{ tools['helm-diff'].path }}", tools = true }
