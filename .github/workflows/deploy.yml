# GitOps for the whole stack. Every job runs the same single command a laptop would, in bootstrap/:
#
#   terragrunt run --all plan|apply|destroy
#
# Terragrunt runs the gitea/ unit (OpenTofu in aws/, then Helmfile from its hooks). CI skips the
# state/ unit; a person runs it once from a laptop.
#
#   pull request          -> plan (tofu plan + helmfile diff), posted as a PR comment
#   merge to main         -> apply
#   manual run (Actions)  -> plan, apply or destroy
#
# Two GitHub environments, each with variable AWS_ROLE_ARN pointing at an OIDC role made by
# bootstrap/state:
#   sandbox-plan  (any branch) -> github-plan  (read-only)
#   sandbox-apply (main only)  -> github-apply (AdministratorAccess)
# Each IAM role trusts only its own environment, so a branch can never get write access. There
# are no static AWS keys anywhere.
name: Gitea deploy
# What each run shows in the Actions list: the PR or commit it is for, or who started it.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Plan · #{0} {1}', github.event.pull_request.number, github.event.pull_request.title)
  || github.event_name == 'push' && format('Deploy · {0}', github.event.head_commit.message)
  || format('Manual {0} · started by {1}', inputs.action, github.actor) }}

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "adrs/**"]
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  TG_NON_INTERACTIVE: "true"
  TG_NO_COLOR: "true"
  # Plain OpenTofu output instead of Terragrunt's log wrapping: readable in logs and PR comments.
  TG_TF_FORWARD_STDOUT: "true"
  MISE_YES: "1"

# Every job waits for bootstrap/state, which sets the repo variable BOOTSTRAPPED. Until then (a
# fresh clone, or the template) pushes and pull requests run nothing.
jobs:
  plan:
    name: Plan
    if: >-
      vars.BOOTSTRAPPED == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sandbox-plan
    # A newer commit on the same PR supersedes an older plan. Plans never queue behind (or
    # displace) applies: they wait for the state lock instead (-lock-timeout in terragrunt.hcl).
    concurrency:
      group: plan-sandbox-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write       # OIDC
      pull-requests: write  # plan comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout:v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # jdx/mise-action:v5.2.1
        with:
          install: true
          cache: true

      - name: Log in to AWS as github-plan (read-only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials:v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan (OpenTofu plan and Helm diff)
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # gruntwork-io/terragrunt-action:v3.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }} # the action posts the comment with it
        with:
          tg_command: run --all plan --working-dir bootstrap
          tg_comment: "1"
          github_token: ${{ github.token }}

  apply:
    name: Deploy
    if: >-
      vars.BOOTSTRAPPED == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: sandbox-apply
    # One apply or destroy at a time, never cancelled half-way.
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ACCOUNT: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout:v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # jdx/mise-action:v5.2.1
        with:
          install: true
          cache: true

      - name: Log in to AWS as github-apply
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials:v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200 # EKS and RDS creation can take over an hour

      - name: Deploy (OpenTofu apply, then Helmfile)
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # gruntwork-io/terragrunt-action:v3.4.1
        with:
          tg_command: run --all apply --working-dir bootstrap
          github_token: ${{ github.token }}

      - name: Show the Gitea URL
        run: |
          lb=$(kubectl --context gitea-sandbox --namespace gitea get ingress gitea --output 'jsonpath={.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          {
            echo "### sandbox: ${lb:+http://$lb/}"
            echo
            echo "Admin user \`gitea_admin\`; password in AWS console -> Secrets Manager -> \`gitea/admin\`."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy
    if: vars.BOOTSTRAPPED == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: sandbox-apply
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout:v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # jdx/mise-action:v5.2.1
        with:
          install: true
          cache: true

      - name: Log in to AWS as github-apply
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials:v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      # The stack's hooks uninstall the Helm releases (waiting for the load balancers to go) before
      # OpenTofu destroys the stack. state/ is never destroyed.
      - name: Destroy (Helm releases, then OpenTofu)
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # gruntwork-io/terragrunt-action:v3.4.1
        with:
          tg_command: run --all destroy --working-dir bootstrap
          github_token: ${{ github.token }}
